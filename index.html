<!DOCTYPE html>
<html>
<head>
<title>Binaya Minduni Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#E8DCC6;display:flex;justify-content:center;padding:20px;margin:0;overflow-x:hidden;position:relative}
.main{
background:#FFF8E8;
width:100%;max-width:700px;
padding:30px 25px 160px 25px;
position:relative;
border:2.5px solid #3a2e26;
border-radius:38px 42px 35px 45px / 45px 35px 42px 38px;
box-shadow:8px 8px 0 #3a2e26;
z-index:2
}
h1.portfolio{text-align:center;font-family:Arial,sans-serif;font-weight:normal;margin-bottom:25px;font-size:28px}
.info-box{border:2px solid #5a4632;border-radius:22px;padding:15px 18px;margin-bottom:20px;font-family:"Comic Sans MS", cursive, sans-serif;line-height:1.6;background:#fffdf5;font-size:15px}
.skills-title, .cert-title, .github-title{font-family:Arial, Helvetica, sans-serif;font-size:17px;margin:24px 0 10px 0}
.skills-title::before, .cert-title::before, .github-title::before{content:"★ ";}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{border:1.5px solid #3a2e26;border-radius:50%;padding:6px 14px;font-family:Arial, Helvetica, sans-serif;background:#fffdf5;font-size:14px}
.cert-box{border:2px solid #5a4632;border-radius:16px;padding:14px 16px;margin:14px 0;background:#fffdf5;cursor:pointer;font-family:Arial, Helvetica, sans-serif}
.cert-box small{border:1.5px solid #3a2e26;padding:2px 6px;border-radius:4px;font-size:12px;display:inline-block;margin-top:6px}
.github-btn{border:1.5px solid #3a2e26;border-radius:20px;padding:8px 18px;background:#fffdf5;display:inline-block;text-decoration:none;color:#3a2e26;font-family:Arial, Helvetica, sans-serif}
.character{position:absolute;right:10px;bottom:10px;width:240px;height:240px;z-index:5;background:transparent}
.character video{width:100%;height:100%;object-fit:contain;background:transparent;mix-blend-mode:multiply;filter:contrast(1.1)}
.float{position:absolute;width:26px;height:26px;z-index:1;pointer-events:none;animation:softFloat 5s ease-in-out infinite}
@keyframes softFloat{0%,100%{transform:translateY(0px) rotate(0deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.f1{top:-8px;left:-12px;animation-delay:0s}
.f2{top:40px;right:-14px;animation-delay:0.8s;width:24px}
.f3{top:180px;left:-16px;animation-delay:1.6s;width:25px}
.f4{top:320px;right:-12px;animation-delay:0.4s}
.f5{bottom:220px;left:-14px;animation-delay:1.2s;width:24px}
.f6{bottom:80px;right:200px;animation-delay:2s;width:28px}
.f7{top:90px;left:20px;animation-delay:2.4s;width:22px}
.f8{bottom:40px;left:30px;animation-delay:0.2s;width:23px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:20}
.modal-box{background:#FFF8E8;padding:25px;border-radius:18px;max-width:380px;width:90%;border:2px solid #3a2e26;font-family:Arial, Helvetica, sans-serif}
.close{float:right;cursor:pointer;font-size:20px}
</style>
</head>
<body>

<div class="main">
<img class="float f1" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg">
<img class="float f2" src="https://cdn-icons-png.flaticon.com/512/25/25231.png">
<img class="float f3" src="https://cdn-icons-png.flaticon.com/512/300/300221.png">
<img class="float f4" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg">
<img class="float f5" src="https://cdn-icons-png.flaticon.com/512/25/25231.png">
<img class="float f6" src="https://cdn-icons-png.flaticon.com/512/2702/2702602.png">
<img class="float f7" src="https://cdn-icons-png.flaticon.com/512/906/906324.png">
<img class="float f8" src="https://cdn-icons-png.flaticon.com/512/25/25231.png">

<h1 class="portfolio">Portfolio</h1>
<div class="info-box">
<b>Binaya Minduni Jayasinghe Perera</b><br>
Computer Science Undergraduate | NSBM Green University<br>
Galle District, Southern Province | Sri Lanka.
</div>
<div class="skills-title">Skills</div>
<div class="badges">
<span class="badge">Python</span><span class="badge">OOP</span><span class="badge">GitHub</span><span class="badge">HTML</span><span class="badge">CSS</span>
</div>
<div class="cert-title">Certifications</div>
<div class="cert-box" onclick="openBox('cisco')"><b>Python Essentials 2 - Cisco</b><br><small>Oct 2026</small></div>
<div class="cert-box" onclick="openBox('hr')"><b>Python (Basic) - HackerRank</b><br><small>Oct 2026</small></div>
<div class="github-title">Github Profile</div>
<a class="github-btn" href="https://github.com/binayaminduni" target="_blank">GitHub</a>
<div class="character">
<video autoplay loop muted playsinline><source src="character.mp4.mp4" type="video/mp4"></video>
</div>
</div>

<div id="m" class="modal" onclick="closeBox()"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeBox()">x</span><div id="body"></div></div></div>
<script>
function openBox(t){document.getElementById('m').style.display='flex';if(t=='cisco'){document.getElementById('body').innerHTML="<h3>Python Essentials 2</h3><p>Cisco Networking Academy</p><p><b>ID:</b> cf56f0ae-0bd3-4986-9302-48671bdc1ea6</p>"}else{document.getElementById('body').innerHTML="<h3>Python (Basic)</h3><p>HackerRank</p><p><b>ID:</b> 365FACE538FD</p><a href='https://www.hackerrank.com/certificates/365face538fd' target='_blank'>Verify</a>"}}
function closeBox(){document.getElementById('m').style.display='none'}
</script>
</body>
</html>
